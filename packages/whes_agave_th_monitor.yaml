      - name: "Agave EMS Error Text"
        unique_id: agave_ems_error_text
        icon: mdi:alert-circle-outline
        state: >
          {% set c = states('sensor.agave_ems_error_code')|int(-1) %}
          {% if c == -1 %}Unavailable
          {% elif c == 0 %}OK – No Errors
          {% else %}
            {% set errors = namespace(list=[]) %}
            {% if c | bitwise_and(1) %}{% set errors.list = errors.list + ['Inverter Information Loss'] %}{% endif %}
            {% if c | bitwise_and(2) %}{% set errors.list = errors.list + ['Inverter Data Loss'] %}{% endif %}
            {% if c | bitwise_and(4) %}{% set errors.list = errors.list + ['BMS Communication Failure'] %}{% endif %}
            {% if c | bitwise_and(8) %}{% set errors.list = errors.list + ['AC Meter Communication Failure'] %}{% endif %}
            {% if c | bitwise_and(16) %}{% set errors.list = errors.list + ['PV Meter Communication Failure'] %}{% endif %}
            {% if c | bitwise_and(32) %}{% set errors.list = errors.list + ['Output Overlimit Fault'] %}{% endif %}
            {% if c | bitwise_and(64) %}{% set errors.list = errors.list + ['External Flash Not Found'] %}{% endif %}
            {% if c | bitwise_and(128) %}{% set errors.list = errors.list + ['EEPROM Not Found'] %}{% endif %}
            {% if c | bitwise_and(256) %}{% set errors.list = errors.list + ['Master-Slave Communication Failure'] %}{% endif %}
            {% if c | bitwise_and(512) %}{% set errors.list = errors.list + ['RTC Not Working'] %}{% endif %}
            {% if c | bitwise_and(1024) %}{% set errors.list = errors.list + ['Meter Type Mismatch'] %}{% endif %}
            {% if c | bitwise_and(2048) %}{% set errors.list = errors.list + ['Diesel Generator Start Failure'] %}{% endif %}
            {% if c | bitwise_and(4096) %}{% set errors.list = errors.list + ['PCU Relay Sticking Fault'] %}{% endif %}

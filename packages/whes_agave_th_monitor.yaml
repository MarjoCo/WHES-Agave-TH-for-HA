# WHES Agave TH (formerly Ecos eCactus) — monitoring package for Home Assistant
#
# Read only: reads the inverter over Modbus and never writes to it.
# Before use, set your RS485-to-Ethernet converter's IP address in the
# modbus: section below (search for CHANGE). See README.md.
#
# Scan intervals: 1 s for the values you control with (grid power, battery
# power, phase currents and powers, work mode, PowerRef, EPS output),
# 5 s for live dashboard values, 30 s for slow values, 0 = read once at start.
#
# Sign conventions differ between registers:
#   36275 Grid total power     positive = import, negative = export
#   36307 Battery power (PCS)  positive = DISCHARGE, negative = charge
#   36303 Battery power (BMS)  positive = CHARGE, negative = discharge

modbus:

  - name: agave_inverter
    type: tcp
    host: 192.168.1.100  # <-- CHANGE: IP address of your RS485-to-Ethernet converter
    port: 502 # <-- CHANGE if your converter uses another port
    delay: 0
    timeout: 5
    retries: 3
    close_comm_on_error: false
    sensors:
      # Grid power at the inverter's meter. Positive = import from grid, negative = export.
      # Read every second: the fastest value you have for fuse protection.
      - name: "Agave Grid Total Power"
        unique_id: agave_grid_total_power
        slave: 1
        address: 36275
        input_type: input
        data_type: int32
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 1
      # Battery power, inverter (PCS) side. Positive = DISCHARGE, negative = charge.
      - name: "Agave Battery Power PCS"
        unique_id: agave_battery_power_pcs
        slave: 1
        address: 36307
        input_type: input
        data_type: int32
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 1
      - name: "Agave Phase R Current"
        unique_id: agave_phase_r_current
        slave: 1
        address: 36255
        input_type: input
        data_type: int16
        scale: 0.1
        precision: 2
        unit_of_measurement: "A"
        state_class: measurement
        scan_interval: 1
      - name: "Agave Phase S Current"
        unique_id: agave_phase_s_current
        slave: 1
        address: 36262
        input_type: input
        data_type: int16
        scale: 0.1
        precision: 2
        unit_of_measurement: "A"
        state_class: measurement
        scan_interval: 1
      - name: "Agave Phase T Current"
        unique_id: agave_phase_t_current
        slave: 1
        address: 36269
        input_type: input
        data_type: int16
        scale: 0.1
        precision: 2
        unit_of_measurement: "A"
        state_class: measurement
        scan_interval: 1
      - name: "Agave Phase R Power"
        unique_id: agave_phase_r_power
        slave: 1
        address: 36257
        input_type: input
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 1
      - name: "Agave Phase S Power"
        unique_id: agave_phase_s_power
        slave: 1
        address: 36264
        input_type: input
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 1
      - name: "Agave Phase T Power"
        unique_id: agave_phase_t_power
        slave: 1
        address: 36271
        input_type: input
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 1
      # 60001 work mode: 0 Normal (ECOS), 1 VPP mode 1 = Full external control,
      # 2 PV charge only, 3 Discharge only.
      - name: "Agave Work Mode"
        unique_id: agave_work_mode_read
        slave: 1
        address: 60001
        input_type: holding
        data_type: uint16
        scan_interval: 1
      # 60004 PowerRef: the battery power HA asks for. Only effective in VPP mode 1.
      - name: "Agave Battery Power Reference"
        unique_id: agave_bat_power_ref_read
        slave: 1
        address: 60004
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 1
      - name: "Agave EPS Phase R Voltage"
        unique_id: agave_eps_phase_r_voltage
        slave: 1
        address: 36230
        input_type: input
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 1
      - name: "Agave EPS Phase R Current"
        unique_id: agave_eps_phase_r_current
        slave: 1
        address: 36231
        input_type: input
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "A"
        state_class: measurement
        scan_interval: 1
      - name: "Agave EPS Phase R Active Power"
        unique_id: agave_eps_phase_r_active_power
        slave: 1
        address: 36233
        input_type: input
        data_type: int32
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 1
      - name: "Agave EPS Phase R Reactive Power"
        unique_id: agave_eps_phase_r_reactive_power

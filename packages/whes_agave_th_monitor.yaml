template:

  - sensor:
      - name: "Agave Total PV Power"
        unique_id: agave_total_pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ 
            (states('sensor.agave_pv1_power')|float(0) +
            states('sensor.agave_pv2_power')|float(0)) | round(0)
          }}
      - name: "Agave Battery Status"
        unique_id: agave_battery_status
        state: >
          {% set bat = states('sensor.agave_battery_power_pcs')|float(0) %}
          {% if bat > 50 %}Discharging
          {% elif bat < -50 %}Charging
          {% else %}Idle
          {% endif %}
        icon: >
          {% set bat = states('sensor.agave_battery_power_pcs')|float(0) %}
          {% if bat > 0 %}mdi:battery-minus
          {% elif bat < 0 %}mdi:battery-plus
          {% else %}mdi:battery{% endif %}
      - name: "Agave Run Mode Text"
        unique_id: agave_run_mode_text
        state: >
          {% set mode = states('sensor.agave_run_mode')|int(-1) %}
          {% if mode == 0 %}Waiting for Grid
          {% elif mode == 1 %}Online
          {% elif mode == 2 %}Offline
          {% elif mode == 3 %}Fault
          {% elif mode == 4 %}Reserved
          {% elif mode == 5 %}Checking
          {% else %}{{ this.state }}{% endif %}
      - name: "Agave Work Mode Text"
        unique_id: agave_work_mode_text
        icon: mdi:cog-outline
        state: >
          {% set mode = states('sensor.agave_work_mode')|int(-1) %}
          {% if mode == 0 %}Normal Mode (ECOS control)
          {% elif mode == 1 %}VPP Mode 1 - Full external control
          {% elif mode == 2 %}PV charge only
          {% elif mode == 3 %}Discharge only
          {% else %}{{ this.state }}{% endif %}
      - name: "Agave DSP Error Text"
        unique_id: agave_dsp_error_text
        icon: mdi:alert-circle-outline
        state: >
          {% set c = states('sensor.agave_dsp_error_code')|int(-1) %}
          {% if c == -1 %}Unavailable
          {% elif c == 0 %}OK – No Errors
          {% elif c == 1 %}PV1 Overvoltage Fault
          {% elif c == 2 %}PV1 Overcurrent Fault
          {% elif c == 3 %}PV2 Overvoltage Fault

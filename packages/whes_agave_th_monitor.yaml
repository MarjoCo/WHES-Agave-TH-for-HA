          {% elif c == 37 %}Module Under Voltage Protection
          {% elif c == 38 %}Module Over Voltage Protection
          {% elif c == 39 %}Voltage Sensor Failure
          {% elif c == 40 %}Temperature Sample Error
          {% elif c == 41 %}Internal Communication Error
          {% elif c == 42 %}Input Overvoltage Fault
          {% elif c == 43 %}Input Reverse Connection Fault

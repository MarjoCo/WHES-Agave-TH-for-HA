          {% else %}Unknown BMS Error Code: {{ c }}{% endif %}
      # Dashboard copies that keep the last value through a short read break.
      - name: "Agave Battery SOC UI"
        unique_id: agave_battery_soc_ui
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >
          {% set raw = states('sensor.agave_battery_soc') %}
          {% if raw in ['unknown','unavailable','none',''] %}
            {{ this.state }}
          {% else %}
            {% set v = raw | int(0) %}
            {{ this.state if v == 0 else v }}
          {% endif %}
        icon: >
          {% set soc = states('sensor.agave_battery_soc_ui') | int(-1) %}
          {% set pwr = states('sensor.agave_battery_power_pcs') | int(0) %}
          {% if soc == -1 %}mdi:battery-unknown
          {% elif soc < 10 %}
            {% if pwr >= 0 %}mdi:battery-alert{% else %}mdi:battery-charging-outline{% endif %}
          {% else %}
            {% set level = ((soc + 5) // 10) * 10 %}
            {% if level >= 100 %}
              {% if pwr >= 0 %}mdi:battery{% else %}mdi:battery-charging{% endif %}
            {% else %}
              {% if pwr >= 0 %}mdi:battery-{{ level }}{% else %}mdi:battery-charging-{{ level }}{% endif %}
            {% endif %}
          {% endif %}
      - name: "Agave Grid UI"
        unique_id: agave_grid_ui
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set raw = states('sensor.agave_grid_total_power') %}
          {% if raw in ['unknown','unavailable','none',''] %}
            {{ this.state }}
          {% else %}
            {{ raw | float }}
          {% endif %}
        icon: >
          {% set p = states('sensor.agave_grid_ui') | float(0) %}
          {% if p > 0 %}mdi:home-import-outline
          {% elif p < 0 %}mdi:home-export-outline
          {% else %}mdi:home-outline{% endif %}
      - name: "Agave Battery Power PCS UI"
        unique_id: agave_battery_power_pcs_ui
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set raw = states('sensor.agave_battery_power_pcs') %}
          {% if raw in ['unknown','unavailable','none',''] %}
            {{ this.state }}
          {% else %}
            {% set v = raw | float(0) %}
            {% if v == 0 %}{{ this.state }}
            {% else %}{{ v }}{% endif %}
          {% endif %}
      - name: "Agave Grid Import Power"
        unique_id: agave_grid_import_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.agave_grid_total_power') | float(0) %}
          {{ p if p > 0 else 0.0 }}
      - name: "Agave Grid Export Power"
        unique_id: agave_grid_export_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.agave_grid_total_power') | float(0) %}
          {{ (p * -1) if p < 0 else 0.0 }}
      # Rated capacity x SOH, in kWh. A level, not accumulated energy, so no
      # device_class energy. During a read break it is unavailable rather than 0,
      # so nothing divides by zero.
      - name: "Agave Battery Usable Capacity"
        unique_id: agave_battery_usable_capacity
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: >
          {{ states('sensor.agave_battery_rated_capacity') | float(0) > 0
             and has_value('sensor.agave_battery_soh') }}
        state: >
          {% set rated = states('sensor.agave_battery_rated_capacity') | float(0) %}
          {% set soh = states('sensor.agave_battery_soh') | float(100) %}
          {{ (rated * soh / 100 / 1000) | round(3) }}
      - name: "Agave Battery Remaining kWh"
        unique_id: agave_battery_remaining_kwh
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: >
          {{ states('sensor.agave_battery_usable_capacity') | float(0) > 0
             and has_value('sensor.agave_battery_soc') }}
        state: >
          {% set usable = states('sensor.agave_battery_usable_capacity') | float(0) %}
          {% set soc = states('sensor.agave_battery_soc') | float(0) %}
          {{ (usable * soc / 100) | round(2) }}

  - triggers:
      - trigger: state
        entity_id: sensor.agave_battery_total_charge_energy_raw
      - trigger: homeassistant
        event: start
    sensor:
      # Lifetime battery charge/discharge energy for the Energy dashboard. The raw
      # registers can drop for a moment on a read error; these never go down.
      - name: "Agave Battery Total Charge Energy"
        unique_id: agave_battery_total_charge_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set new = states('sensor.agave_battery_total_charge_energy_raw') | float(0) %}
          {% set old = this.state | float(0) %}
          {{ new if new >= old else old }}

  - triggers:
      - trigger: state
        entity_id: sensor.agave_battery_total_discharge_energy_raw
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Agave Battery Total Discharge Energy"
        unique_id: agave_battery_total_discharge_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set new = states('sensor.agave_battery_total_discharge_energy_raw') | float(0) %}
          {% set old = this.state | float(0) %}
          {{ new if new >= old else old }}

utility_meter:
  agave_solar_production_daily:
    source: sensor.agave_total_pv_energy
    cycle: daily
    name: Agave Solar Production Daily
  agave_battery_charge_daily:
    source: sensor.agave_battery_total_charge_energy
    cycle: daily
    name: Agave Battery Charge Daily
  agave_battery_discharge_daily:
    source: sensor.agave_battery_total_discharge_energy
    cycle: daily
    name: Agave Battery Discharge Daily
  agave_grid_import_daily:
    source: sensor.agave_total_consumption_from_grid_energy
    cycle: daily
    name: Agave Grid Import Daily
  agave_grid_export_daily:
    source: sensor.agave_total_feed_to_grid_energy
    cycle: daily
    name: Agave Grid Export Daily
  agave_eps_output_daily:
    source: sensor.agave_total_eps_energy
    cycle: daily
    name: Agave EPS Output Daily

automation:

  - id: agave_dsp_error_critical_notify
    alias: "Agave DSP Error – Critical notify"
    description: "Critical notification when the DSP error code is above 0. Does not fire when the value returns after a connection break."
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.agave_dsp_error_code
        above: 0
    conditions:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown', 'none', '']
             and trigger.to_state is not none
             and trigger.to_state.state not in ['unavailable', 'unknown', 'none', ''] }}
    actions:
      - action: notify.notify
        data:
          title: "🚨 AGAVE – DSP Error"
          message: >
            DSP error detected on Agave inverter.
            Code: {{ states('sensor.agave_dsp_error_code') }}
            Description: {{ states('sensor.agave_dsp_error_text') }}
          data:
            ttl: 0
            priority: high
            push:
              sound:
                name: default
                critical: 1
                volume: 1

  - id: agave_ems_error_critical_notify
    alias: "Agave EMS Error – Critical notify"
    description: "Critical notification when the EMS error code is above 0. Does not fire when the value returns after a connection break."
